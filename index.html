<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%aurora-icon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Aurora" />
    <title>AI Aurora — Conversation. Creativity. Connection.</title>
    <meta name="description" content="AI Aurora is an AI companion for conversation, creativity and thinking out loud." />
    <meta name="theme-color" content="#090817" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const showBootFailure = () => {
          if (document.getElementById('aurora-boot-failure')) return
          const rootElement = document.getElementById('root')
          if (!rootElement) return
          const panel = document.createElement('main')
          panel.id = 'aurora-boot-failure'
          panel.setAttribute('role', 'alert')
          const heading = document.createElement('h1')
          heading.textContent = 'Aurora could not start'
          const message = document.createElement('p')
          message.textContent = 'A loading problem occurred. Please reload Aurora.'
          const retry = document.createElement('button')
          retry.textContent = 'Reload Aurora'
          retry.addEventListener('click', () => window.location.reload())
          panel.append(heading, message, retry)
          rootElement.replaceChildren(panel)
        }
        window.addEventListener('error', showBootFailure)
        window.addEventListener('unhandledrejection', showBootFailure)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
