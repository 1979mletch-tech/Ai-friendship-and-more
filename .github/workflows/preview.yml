name: AI Friendship production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ai-friendship-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://smsewzcyrqxiamqepffz.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_MibufSSIfmDOqhZfIMNs8Q_Opvbmm3i
      VITE_CHAT_API_URL: https://smsewzcyrqxiamqepffz.supabase.co/functions/v1/chat
      VITE_PUBLIC_LIVE_MODE: 'true'
      VITE_AGE_VERIFICATION_ENABLED: 'true'
      VITE_AURORA_SPEECH_ENABLED: 'true'
      VITE_BILLING_PROVIDER: stripe
      VITE_STRIPE_PRICE_PRO_DAILY: price_1ULbdmCnBoiV72UUnsHlPKah
      VITE_STRIPE_PRICE_PRO_WEEKLY: price_1ULbdrCnBoiV72UUHpsvDIc9
      VITE_STRIPE_PRICE_PRO_MONTHLY: price_1ULbdyCnBoiV72UU8G420ftw
      VITE_STRIPE_PRICE_PRO_ANNUAL: price_1ULbe3CnBoiV72UUBT3sGUEc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Preserve verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-friendship-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy production
        id: deployment
        uses: actions/deploy-pages@v4
