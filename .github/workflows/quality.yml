name: AI Friendship quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package complete source export
        run: git archive --format=zip --prefix=ai-friendship-and-more/ HEAD -o "$RUNNER_TEMP/ai-friendship-project-${GITHUB_SHA}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-friendship-project-${{ github.sha }}
          path: ${{ runner.temp }}/ai-friendship-project-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 30
