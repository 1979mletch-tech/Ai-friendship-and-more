<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="RushOps - BuildRush Owner and Executive AI">
  <defs>
    <linearGradient id="bgOwner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadowOwner" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#bgOwner)" stroke="#38bdf8" stroke-width="2.5" filter="url(#shadowOwner)" />

  <!-- Executive Shield / Hexagon core -->
  <path d="M 60 22 L 86 36 L 86 64 C 86 78 60 92 60 92 C 60 92 34 78 34 64 L 34 36 Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2" />

  <!-- Analytics / Chart Bars inside shield -->
  <rect x="44" y="58" width="6" height="18" rx="2" fill="#38bdf8" />
  <rect x="53" y="48" width="6" height="28" rx="2" fill="#06b6d4" />
  <rect x="62" y="40" width="6" height="36" rx="2" fill="url(#goldAccent)" />
  <rect x="71" y="52" width="6" height="24" rx="2" fill="#38bdf8" />

  <!-- Upward Trend Line -->
  <polyline points="46,56 56,46 65,38 74,49" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="65" cy="38" r="2.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1" />

  <!-- Owner Security Lock Icon -->
  <path d="M 54 28 C 54 23 66 23 66 28 L 66 32 L 54 32 Z" fill="none" stroke="#fbbf24" stroke-width="2" />
  <rect x="52" y="32" width="16" height="10" rx="2" fill="#fbbf24" />
  <circle cx="60" cy="37" r="1.5" fill="#0b192c" />

  <!-- AI Disclosure Pill -->
  <rect x="26" y="100" width="68" height="15" rx="7.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
  <text x="60" y="110.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" fill="#0b192c" text-anchor="middle" letter-spacing="0.5">OWNER HQ AI</text>
</svg>